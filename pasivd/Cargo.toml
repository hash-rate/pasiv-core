[package]
name = "pasivd"
version = "0.1.9"
edition = "2021"
description = "Headless Pasiv node: CPU-mines Monero paid to your address (USDT via unMineable, or XMR direct), pairs with your account via a claim code, controllable from the Pasiv companion app."
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
flate2 = "1"
tar = "0.4"
minisign-verify = "0.2"
# Crash reporting (src/sentry.rs): panics only, scrubbed (src/scrub.rs), off
# with `"telemetry": false` or PASIVD_TELEMETRY=0. Pinned to 0.46 — the last
# sentry on reqwest 0.12, so the static musl binary carries ONE reqwest/hyper/
# rustls stack (0.47+ moved to reqwest 0.13, a second copy of all three).
sentry = { version = "0.46", default-features = false, features = ["backtrace", "contexts", "panic", "debug-images", "reqwest", "rustls"] }
# The scrubber's patterns (pure Rust; no new native code in the static build).
regex = "1"


[dependencies.pasiv-core]
path = "../crates/pasiv-core"
