[package]
name = "pasiv-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The open core of Pasiv — the code that touches money: the fee engine, coin/pool roster, payout validators, mining state machine, and earnings math."
repository = "https://github.com/hash-rate/pasiv-core"

[lib]
name = "pasiv_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The vendored VerusHash C++ (MIT) — arm64/clang-patched; macOS-only for now.
verushash-rs = { path = "../../vendor/verushash-rs" }
