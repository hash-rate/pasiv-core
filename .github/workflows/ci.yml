# Public CI — build, lint, test, and produce an unsigned static pasivd.
# Deliberately secret-free: signing and publishing stay in the private release
# pipeline, so nothing in this repository's CI can touch a key.
#
# Triggers on every branch (not just main) — hard-won rationale inherited from
# the private repo: releases have been tagged off feature branches, and a
# main-only gate never ran for anything that shipped.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, SHA-pinned
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # pasiv-core is the pure money-path code; it measures ~95% and the floor
      # only ratchets up.
      - run: cargo llvm-cov -p pasiv-core --fail-under-lines 90
      # pasivd's uncovered mass is the async run loop and the network commands
      # (claim/doctor/run) — the pure fee/config/args logic is what the floor
      # protects. 28 → 26 on 2026-08-26 is NOT a ratchet-down of coverage: the
      # well-tested xmrig contract (runtime config, parsers) moved into
      # pasiv-core where it is measured under the 90 floor, shrinking this
      # crate's covered numerator. Raise as the run loop grows seams.
      - run: cargo llvm-cov -p pasivd --fail-under-lines 26

  # The Verus engine's vendored VerusHash C++ is arm64/clang-only, so the
  # macOS job is what actually compiles and tests it (the ubuntu job cfg's the
  # module out). Public repos get macOS runners on free minutes.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, SHA-pinned
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: cargo clippy -p pasiv-core --all-targets -- -D warnings
      # This is the only job where the Verus engine compiles, so it is the only
      # honest coverage number for it — the ubuntu floor (90) is measured on a
      # tree with verus.rs cfg'd out entirely. Measured 82.8 here; floor
      # ratchets up, never down.
      - run: cargo llvm-cov -p pasiv-core --fail-under-lines 80

  musl:
    # The exact build the release pipeline attaches to Pasiv releases:
    # static x86-64 musl, staticness asserted, sha256 alongside. No signing,
    # no publishing here — artifact only.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, SHA-pinned
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p pasivd --target x86_64-unknown-linux-musl
      - name: Assert static + checksum
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/pasivd
          file "$BIN" | grep -q "static" || { echo "pasivd is not statically linked"; exit 1; }
          cp "$BIN" pasivd-linux-x64
          sha256sum pasivd-linux-x64 | tee pasivd-linux-x64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pasivd-linux-x64
          path: |
            pasivd-linux-x64
            pasivd-linux-x64.sha256

  # Secret/PII gate over the FULL history: default gitleaks rules plus a
  # private ruleset delivered via the GITLEAKS_CONFIG_B64 secret. The ruleset
  # names the exact strings it hunts, so it can never be a checked-in file
  # here; rule ids are neutral (px-NN) and findings print --redact'ed, so a
  # hit in this public log discloses nothing. Gated off pull_request: fork
  # PRs have no secrets and would fail spuriously — their content is scanned
  # by the push run when it lands on a branch here.
  hygiene:
    if: github.repository == 'hash-rate/pasiv-core' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks (full history, private ruleset)
        env:
          GITLEAKS_CONFIG_B64: ${{ secrets.GITLEAKS_CONFIG_B64 }}
        run: |
          [ -n "$GITLEAKS_CONFIG_B64" ] || { echo "::error::GITLEAKS_CONFIG_B64 secret missing"; exit 1; }
          printf '%s' "$GITLEAKS_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/rules.toml"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config "$RUNNER_TEMP/rules.toml" .

  # RUN the installer, don't just diff it. install.sh is what users pipe into a
  # root shell, and until now nothing executed it anywhere automatic — the
  # mirror job below only proves the two copies match, so both could be broken
  # together and stay green. It also exercises the path added 2026-08-28, where
  # a missing minisign is installed from the distro's own repositories and the
  # install REFUSES rather than falling back to a checksum that shares an origin
  # with the binary.
  #
  # No mining happens: the installer places the binary and a systemd unit and
  # stops, because a node must be claimed and started deliberately. That is what
  # keeps this inside GitHub's acceptable use — the release pipeline's sidecar
  # smoke is `--version`-only for the same reason.
  installer-runs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install.sh installs a verified pasivd
        run: |
          set -euo pipefail
          # Prove the auto-install path is the one under test.
          if command -v minisign >/dev/null 2>&1; then
            sudo apt-get remove -y minisign >/dev/null 2>&1 || true
          fi
          ! command -v minisign >/dev/null 2>&1 || { echo "::error::minisign still present; the auto-install path would be skipped"; exit 1; }

          sudo bash pasivd/install.sh

          command -v pasivd >/dev/null || { echo "::error::pasivd not on PATH after install"; exit 1; }
          command -v minisign >/dev/null || { echo "::error::installer did not install minisign"; exit 1; }
          pasivd version
          test -f /etc/systemd/system/pasivd.service || { echo "::error::unit not installed"; exit 1; }

          # Installed, deliberately NOT running: claiming and starting are the
          # user's explicit acts, and CI must never leave a miner running.
          ! systemctl is-active --quiet pasivd || { echo "::error::installer started the daemon"; exit 1; }
          ! systemctl is-enabled --quiet pasivd || { echo "::error::installer enabled the daemon"; exit 1; }
          echo "installer OK: $(pasivd version 2>&1 | head -1)"

      - name: install.sh refuses when the signature cannot be verified
        run: |
          set -euo pipefail
          # Point the signature at a URL that 404s; everything else is untouched.
          sed 's|^SIG_URL=.*|SIG_URL="https://github.com/hash-rate/pasiv-releases/releases/latest/download/definitely-not-a-signature"|' \
            pasivd/install.sh > /tmp/install-nosig.sh
          if sudo bash /tmp/install-nosig.sh; then
            echo "::error::installer completed without a verifiable signature — it must fail closed"
            exit 1
          fi
          echo "fail-closed OK: refused an unverifiable download"

  # The site serves pasiv.network/pasivd.sh; this repo owns pasivd/install.sh.
  # They must be byte-identical — they drifted once in the private era (the
  # site copy kept pointing at a moved repo namespace and only worked through
  # a transfer redirect). Both are public now, so the check needs no token.
  installer-mirror:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install.sh must match what the site serves
        run: |
          # FAIL CLOSED: a drift check that green-lights on network failure
          # will eventually be the reason drift ships again. Retries absorb
          # transient blips; a genuinely unreachable site fails the job.
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 -o site-pasivd.sh https://pasiv.network/pasivd.sh \
            || { echo "::error::could not fetch pasiv.network/pasivd.sh - mirror check cannot pass unverified"; exit 1; }
          diff -u pasivd/install.sh site-pasivd.sh \
            || { echo "::error::pasivd/install.sh and pasiv.network/pasivd.sh have drifted"; exit 1; }
          echo "installer mirror OK"
